# Lockscreen for hyprlock
# See https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/
#
# Colors match the Hyprland border theme used in hyprland.lua
# (active_border cyan -> green gradient, inactive gray).

$accent = rgba(33ccffee)
$accent2 = rgba(00ff99ee)
$muted = rgba(595959aa)

general {
    hide_cursor = false
    grace = 2
    disable_loading_bar = false
}

background {
    monitor =
    path = /opt/shared-configs/wallpaper.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.6
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffee)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(ffffffcc)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# Password input field
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.25
    outer_color = $accent
    inner_color = rgba(20202088)
    font_color = rgba(ffffffee)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    check_color = $accent2
    fail_color = rgba(ff5555ee)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -120
    halign = center
    valign = center
}
