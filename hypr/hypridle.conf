# Idle daemon config for hypridle
# See https://github.com/hyprwm/hypridle
#
# Locks the screen (via hyprlock) after 5 min idle, turns the display off
# after 5.5 min idle, and always locks before the system suspends (e.g. lid
# close, once HandleLidSwitch is set to "suspend" in logind.conf).

general {
    lock_cmd = pidof hyprlock || hyprlock                     # avoid spawning multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                  # lock BEFORE the system actually suspends
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'     # wake the screen back up on resume
}

# Lock the session after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the display off after 5.5 minutes of inactivity (30s after locking)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}
